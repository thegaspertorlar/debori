<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Light blue gradient background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff9ff" />
      <stop offset="50%" stop-color="#ccecff" />
      <stop offset="100%" stop-color="#8cc9f2" />
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(280 220) rotate(90) scale(220 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1320 180) rotate(90) scale(260 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <circle cx="280" cy="220" r="220" fill="url(#glow1)" />
  <circle cx="1320" cy="180" r="260" fill="url(#glow2)" />
  <circle cx="1450" cy="760" r="240" fill="rgba(64,138,197,0.10)" />
</svg>
